name: build-ios-simulator

# 目标：产出一个「模拟器版 .app」，不需要任何签名。
#
# 为什么这条路能绕开 Apple 账号：
#   模拟器构建（-sdk iphonesimulator）根本不走代码签名流程，
#   所以不需要 Apple ID、不需要开发者账号、不需要描述文件。
#
# 为什么用 GitHub Actions：
#   官方计费文档明确写：公有仓库的标准 runner 免费（含 macOS）。
#   所以我们不花一分钱就能拿到一台 macOS 编译机。
#
# 产出物怎么用：
#   下载 artifact 里的 .app -> 压成 zip -> 上传 appetize.io -> 浏览器里跑

on:
  push:
    branches: [main]
    paths: ['app-ios/**', 'web/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build

      - name: 同步进 iOS 工程
        run: |
          cd app-ios
          rm -rf www && mkdir -p www
          cp -r ../web/dist/html/. www/
          npm ci
          npx cap sync ios

      - name: 安装 CocoaPods
        run: |
          cd app-ios/ios/App
          pod install

      - name: 编译模拟器版 .app（不签名）
        run: |
          cd app-ios/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 appetize 能吃的 zip
        run: |
          cd app-ios/ios/App/build/Build/Products/Debug-iphonesimulator
          ls -la
          zip -r "\$GITHUB_WORKSPACE/cs-app-simulator.zip" "App.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: cs-app-simulator.zip
          retention-days: 14
