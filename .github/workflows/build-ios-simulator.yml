name: build-ios-simulator

# 目标：产出一个「模拟器版 .app」，不需要任何签名。
#
# 为什么这条路能绕开 Apple 账号：
#   模拟器构建（-sdk iphonesimulator）根本不走代码签名流程，
#   所以不需要 Apple ID、不需要开发者账号、不需要描述文件。
#
# 为什么用 GitHub Actions：
#   官方计费文档明确写：公有仓库的标准 runner 免费（含 macOS）。
#
# 产出物怎么用：
#   下载 artifact 里的 zip -> 上传 appetize.io -> 浏览器里跑 iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build
          ls -la dist/html/*.html

      - name: 同步进 iOS 工程
        run: |
          cd app-ios
          rm -rf www && mkdir -p www
          cp -r ../web/dist/html/. www/
          npm ci
          npx cap sync ios

      - name: 安装 CocoaPods 依赖
        run: |
          cd app-ios/ios/App
          pod install --repo-update
          ls -la
          echo "--- workspace 是否生成 ---"
          ls -d App.xcworkspace || (echo "workspace 没生成" && exit 1)

      - name: 列出可用 scheme（排错用）
        run: |
          cd app-ios/ios/App
          xcodebuild -workspace App.xcworkspace -list || true

      - name: 编译模拟器版 .app（不签名）
        run: |
          cd app-ios/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            build

      - name: 打包成 appetize 能吃的 zip
        run: |
          set -e
          cd app-ios/ios/App
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "找到 app: $APP"
          if [ -z "$APP" ]; then echo "没找到 .app"; exit 1; fi
          cd "$(dirname "$APP")"
          zip -r -y "$GITHUB_WORKSPACE/cs-app-simulator.zip" "$(basename "$APP")"
          cd "$GITHUB_WORKSPACE"
          ls -la cs-app-simulator.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-app
          path: cs-app-simulator.zip
          retention-days: 14
          if-no-files-found: warn
