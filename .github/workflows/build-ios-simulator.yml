name: build-ios-simulator

# 目标：在真实 iOS 模拟器里跑我们的聊天页，截图存证。
#
# 为什么这样做：
#   模拟器构建不需要签名 -> 不需要 Apple 账号
#   macOS runner 自带 iOS Simulator -> 不需要 Appetize 等第三方服务
#   公有仓库标准 runner 免费 -> 零成本
#
# 产出：
#   1. cs-app-simulator.zip（可上传 Appetize 的包）
#   2. shot-*.png 截图（模拟器里跑起来的真实画面）

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build
          ls -la dist/html/*.html

      - name: 同步进 iOS 工程
        run: |
          cd app-ios
          rm -rf www && mkdir -p www
          cp -r ../web/dist/html/. www/
          cp launcher-index.html www/index.html
          test -f www/index.html || (echo "index.html 缺失" && exit 1)
          npm ci
          npx cap sync ios

      - name: 让 App 直接加载服务器页面（模拟真实线上形态）
        run: |
          cd app-ios
          # 线上 App 就是 WebView 加载远端聊天页，这里把远端指向 CI 内部服务
          python3 - <<'PYEOF'
          import json
          p = 'capacitor.config.json'
          c = json.load(open(p, encoding='utf-8'))
          c.setdefault('server', {})
          c['server']['url'] = 'http://127.0.0.1:8000/chat?app_id=app_ci&role_id=999001&ts=1&sign=ci'
          c['server']['cleartext'] = True
          json.dump(c, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(c, ensure_ascii=False, indent=2))
          PYEOF
          npx cap sync ios

      - name: 安装 CocoaPods 依赖
        run: |
          cd app-ios/ios/App
          pod install --repo-update
          ls -d App.xcworkspace || (echo "workspace 没生成" && exit 1)

      - name: 编译模拟器版 App（不签名）
        run: |
          cd app-ios/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 zip（可传 Appetize）
        run: |
          set -e
          cd app-ios/ios/App
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "app: $APP"
          [ -n "$APP" ] || exit 1
          cd "$(dirname "$APP")"
          zip -r -y "$GITHUB_WORKSPACE/cs-app-simulator.zip" "$(basename "$APP")"
          ls -la "$GITHUB_WORKSPACE/cs-app-simulator.zip"

      - name: 起模拟后端（托管前端 + 假接口）
        run: |
          # 静态根目录必须是 html 产物所在目录，否则 /chat 会 404
          cd web/dist/html
          # 探针：把 env(safe-area-inset-*) 的真实取值打到页面上，截图能读到数字
          python3 - <<'PYEOF'
          import re
          probe = '''<script>
          window.addEventListener("load", function () {
            var p = document.createElement("div");
            p.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)";
            document.body.appendChild(p);
            var cs = getComputedStyle(p);
            var d = document.createElement("div");
            d.style.cssText = "position:fixed;left:0;top:70px;z-index:99999;background:#c00;color:#fff;font:13px monospace;padding:6px;line-height:1.5;white-space:pre";
            d.textContent = "SAFE top=" + cs.paddingTop + " bottom=" + cs.paddingBottom +
              "\\ninnerH=" + innerHeight + " screenH=" + screen.height +
              "\\ndpr=" + devicePixelRatio + " ua_iPhone=" + /iPhone/.test(navigator.userAgent);
            document.body.appendChild(d);
          });
          </script>'''
          import io
          fp = 'chat.html'
          s = io.open(fp, encoding='utf-8').read()
          if 'SAFE top=' not in s:
              s = s.replace('</body>', probe + '</body>')
              io.open(fp, 'w', encoding='utf-8').write(s)
              print('探针已注入 chat.html')
          else:
              print('探针已存在')
          PYEOF
          WEB_ROOT="$(pwd)" nohup python3 "$GITHUB_WORKSPACE/ci-mock-server.py" 8000 > /tmp/mock.log 2>&1 &
          sleep 3
          echo "--- 自检 ---"
          curl -s -o /dev/null -w "  /chat -> %{http_code}\n" http://127.0.0.1:8000/chat
          curl -s -o /dev/null -w "  /desk -> %{http_code}\n" http://127.0.0.1:8000/desk
          curl -s -X POST http://127.0.0.1:8000/v1/embed/session \
            -H "Content-Type: application/json" \
            -d '{"app_id":"app_ci","role_id":"999001"}' | head -c 200
          echo
          cat /tmp/mock.log | head -5

      - name: 启动 iOS 模拟器并安装 App
        run: |
          set -x
          xcrun simctl list devices available | grep -i iphone | head -5
          DEV=$(xcrun simctl list devices available | grep -iE "iPhone 1[5-7]" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEV" ]; then
            DEV=$(xcrun simctl list devices available | grep -i iphone | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          fi
          echo "device=$DEV"
          echo "DEV=$DEV" >> $GITHUB_ENV
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APP=$(find app-ios/ios/App/build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "install $APP"
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.cokutau.csapp

      - name: 等页面加载并截图
        run: |
          set -e
          mkdir -p shots
          sleep 15
          xcrun simctl io "$DEV" screenshot shots/shot-1-launch.png
          echo "--- 再来一张（等会话交换完）---"
          sleep 8
          xcrun simctl io "$DEV" screenshot shots/shot-2-loaded.png
          ls -la shots/
          echo "--- 模拟后端收到的请求 ---"
          cat /tmp/mock.log | tail -20
          echo "--- App 日志 ---"
          xcrun simctl spawn "$DEV" log show --last 3m --predicate 'processImagePath CONTAINS "App"' 2>/dev/null | grep -iE "error|webview|load|fail" | tail -15 || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-and-shots
          path: |
            cs-app-simulator.zip
            shots/*.png
          retention-days: 14
          if-no-files-found: warn

      - name: 发布 Release（免登录下载）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" cs-app-simulator.zip shots/*.png \
            --title "iOS 构建 ${{ github.run_number }}" \
            --notes "commit ${{ github.sha }}" \
            --repo "${{ github.repository }}" || true
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"