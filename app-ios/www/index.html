<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>客服</title>
<script>
/**
 * 原生壳（iOS / Android）的启动页。
 *
 * 作用：把游戏传进来的身份参数交给聊天页。
 * 参数来源优先级：
 *   1. URL 查询参数（原生层拼好 URL 传进来）
 *   2. localStorage 里上次保存的（原生层可以预写）
 *   3. 都没有 -> 显示等待提示
 */
(function () {
  var q = new URLSearchParams(location.search);
  var appId = q.get('app_id') || localStorage.getItem('cs_app_id') || '';
  var roleId = q.get('role_id') || localStorage.getItem('cs_role_id') || '';
  var ts = q.get('ts') || '';
  var sign = q.get('sign') || '';

  if (appId && roleId && ts && sign) {
    location.replace('/chat.html?app_id=' + encodeURIComponent(appId) +
      '&role_id=' + encodeURIComponent(roleId) +
      '&ts=' + encodeURIComponent(ts) + '&sign=' + encodeURIComponent(sign));
    return;
  }

  document.body.innerHTML =
    '<div style="padding:40px;font:14px -apple-system,sans-serif;color:#86909c;text-align:center;line-height:1.8">' +
    '<div style="font-size:16px;color:#1d2129;margin-bottom:8px">正在连接客服…</div>' +
    '<div>若长时间无响应，请从游戏内重新打开</div></div>';
})();
</script>
</head>
<body></body>
</html>
